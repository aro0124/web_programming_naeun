
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>쿠키 웹페이지</title>

    <link rel="stylesheet" href="css/style.css">

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="js/script.js" defer></script>
</head>
<body>

<div class="scene">

    <div class="background"></div>

    <!-- 뒤쪽 산 -->
    <img class="mountain mountain-left"
         src="img/mountain_left.png" alt="">

    <img class="mountain mountain-right"
         src="img/mountain_right.png" alt="">

    <!-- 달 / 해 -->
    <img class="moon" src="img/moon.png" alt="">
    <img class="sun" src="img/sun.png" alt="">

    <!-- 좌우 배경 장식 -->
    <img class="mountain-fog mountain-fog-left"
         src="img/mountain_fog_left.png" alt="">

    <img class="mountain-fog mountain-fog-right"
         src="img/mountain_fog_right.png" alt="">

    <img class="fog fog-left"
         src="img/fog_left.png" alt="">

    <img class="fog fog-right"
         src="img/fog_right.png" alt="">


    <!-- ==================== -->
    <!-- 쿠키 캐릭터 -->
    <!-- ==================== -->

    <div class="character character1">
        <img class="cookie" src="img/cookie_burning.png" alt="">
    </div>

    <div class="character character2">
        <img class="cookie" src="img/cookie_dark.png" alt="">
    </div>

    <div class="character character3">
        <img class="cookie" src="img/cookie_eternal.png" alt="">
    </div>

    <div class="character character4">
        <img class="cookie" src="img/cookie_gold.png" alt="">
    </div>

    <div class="character character5">
        <img class="cookie" src="img/cookie_holy.png" alt="">
    </div>

    <div class="character character6">
        <img class="cookie" src="img/cookie_mistic.png" alt="">
    </div>

    <div class="character character7">
        <img class="cookie" src="img/cookie_pure.png" alt="">
    </div>

    <div class="character character8">
        <img class="cookie" src="img/cookie_saint.png" alt="">
    </div>

    <div class="character character9">
        <img class="cookie" src="img/cookie_shadow.png" alt="">
    </div>

    <div class="character character10">
        <img class="cookie" src="img/cookie_silent.png" alt="">
    </div>


<!-- ==================== -->
<!-- 소울잼 -->
<!-- ==================== -->

<img class="gem gem1" src="img/gem_burning.png" alt="">

<img class="gem gem2" src="img/gem_dark.png" alt="">

<img class="gem gem3" src="img/gem_eternal.png" alt="">

<img class="gem gem4" src="img/gem_gold.png" alt="">

<img class="gem gem5" src="img/gem_holy.png" alt="">

<img class="gem gem6" src="img/gem_mistic.png" alt="">

<img class="gem gem7" src="img/gem_pure.png" alt="">

<img class="gem gem8" src="img/gem_saint.png" alt="">

<img class="gem gem9" src="img/gem_shadow.png" alt="">

<img class="gem gem10" src="img/gem_silent.png" alt="">

    <!-- 이것만 캐릭터 앞 -->
    <img class="fog-front"
         src="img/fog_front.png" alt="">

    <!-- 행사 정보 -->
<div class="event-info">

    <!-- 상단 중앙 제목 -->
    <img class="event-title"
         src="img/title.png"
         alt="행사 제목">

    <!-- 하단 왼쪽 시간 -->
    <img class="event-time"
         src="img/date.png"
         alt="날짜">

    <!-- 하단 오른쪽 장소 -->
    <img class="event-place"
         src="img/place.png"
         alt="장소">

</div>

</div>


</body>
</html>
